# Helper modules are shipped base64-encoded. Writing them as Python string
# literals breaks on modules that contain quotes, triple quotes, or backslash
# escapes, which is exactly what a real dependency looks like.
MODULES = {}


def prepare_filesystem():
    workdir = pathlib.Path(tempfile.mkdtemp(prefix="arcade-"))
    os.chdir(workdir)

    for name, payload in ASSETS.items():
        target = pathlib.Path(name)
        target.parent.mkdir(parents=True, exist_ok=True)
        target.write_bytes(base64.b64decode(payload))

    for name, source in MODULES.items():
        target = pathlib.Path(name)
        target.parent.mkdir(parents=True, exist_ok=True)
        target.write_bytes(base64.b64decode(source))

    # Helper packages live beside the entry point, so make them importable.
    if str(workdir) not in sys.path:
        sys.path.insert(0, str(workdir))


prepare_filesystem()

import asyncio
import pygame

class Sling_Shot(pygame.sprite.Sprite):

    def __init__(self, x, y, vel):
        super().__init__()
        self.image = pygame.image.load('data/images/sling_shot.png').convert_alpha()
        self.image.set_colorkey((255, 255, 255))
        self.rect = self.image.get_rect()
        self.rect.x = x
        self.rect.y = y
        self.vel = vel

class Stone(pygame.sprite.Sprite):

    def __init__(self, x, y, vel):
        super().__init__()
        self.image = pygame.image.load('data/images/stone.png')
        self.image.set_colorkey((255, 255, 255))
        self.rect = self.image.get_rect()
        self.rect.x = x
        self.rect.y = y
        self.vel = vel
        self.fired = False

    def update(self):
        if self.fired:
            self.rect.y -= self.vel

class Bird(pygame.sprite.Sprite):

    def __init__(self, x, y, vel, moving, direction):
        super().__init__()
        self.image = pygame.image.load('data/images/bird.png').convert_alpha()
        self.image.set_colorkey((255, 255, 255))
        self.rect = self.image.get_rect()
        self.rect.x = x
        self.rect.y = y
        self.vel = vel
        self.moving = moving
        self.dir = direction

    def update(self):
        if self.moving:
            self.rect.x += self.vel * self.dir
            if self.rect.x <= 100 or self.rect.x + self.rect.width >= 700:
                self.vel = -self.vel

class Current(pygame.sprite.Sprite):

    def __init__(self, x, y, vel):
        super().__init__()
        self.image = pygame.image.load('data/images/current.png')
        self.image.set_colorkey((255, 255, 255))
        self.rect = self.image.get_rect()
        self.rect.x = x
        self.rect.y = y
        self.vel = vel

    def update(self):
        self.rect.x += self.vel
        if self.rect.x <= 100 or self.rect.x + self.rect.width >= 700:
            self.vel = -self.vel

def lvl_selector(lvl):
    birds = []
    match lvl:
        case 1:
            bird = Bird(365, 85, 2, False, 1)
            birds.append(bird)
        case 2:
            bird = Bird(365, 85, 2, True, 1)
            birds.append(bird)
        case 3:
            bird = Bird(365, 85, 2, True, 1)
            bird2 = Bird(365, 205, 2, True, -1)
            birds.append(bird)
            birds.append(bird2)
        case 4:
            bird = Bird(365, 85, 2, True, 1)
            birds.append(bird)
            bird2 = Bird(610, 205, 2, False, 1)
            birds.append(bird2)
        case 5:
            bird = Bird(550, 85, 2, True, -1)
            bird2 = Bird(550, 205, 2, True, 1)
            bird3 = Bird(250, 85, 2, True, -1)
            bird4 = Bird(250, 205, 2, True, 1)
            birds.append(bird)
            birds.append(bird2)
            birds.append(bird3)
            birds.append(bird4)
        case 6:
            bird = Bird(550, 85, 2, True, 1)
            birds.append(bird)
        case 7:
            bird = Bird(550, 85, 2, True, 1)
            bird3 = Bird(250, 85, 2, True, -1)
            birds.append(bird)
            birds.append(bird3)
    return birds

class Box(pygame.sprite.Sprite):

    def __init__(self, x, y):
        super().__init__()
        self.image = pygame.image.load('data/images/box.png').convert_alpha()
        self.image.set_colorkey((255, 255, 255))
        self.rect = self.image.get_rect()
        self.rect.x = x
        self.rect.y = y

def box_selector(lvl, sprite_group):
    match lvl:
        case 4:
            box = Box(590, 119)
            sprite_group.add(box)
        case _:
            sprite_group.empty()
    return sprite_group

def current_selector(lvl, sprite_group):
    match lvl:
        case 6:
            current = Current(450, 260, 3)
            current2 = Current(350, 260, 3)
            sprite_group.add(current, current2)
        case 7:
            current = Current(385, 260, 0)
            current2 = Current(350, 260, 0)
            sprite_group.add(current, current2)
        case _:
            sprite_group.remove()
    return sprite_group

def render_text(text, text_color, x, y, win, size):
    font = pygame.font.SysFont('comic sans', size, bold=True)
    text_surface = font.render(text, True, text_color)
    text_width = text_surface.get_width() // 2
    x -= text_width
    win.blit(text_surface, (x, y))

async def game_loop():
    sling_shot = Sling_Shot(375, 500, 5)
    stone = Stone(387.5, 485, 5)
    lvl = 1
    lives = 3
    throws = 0
    kills = 0
    y = 150
    d = -1
    vel = 0.5
    current_group = pygame.sprite.Group()
    box_group = pygame.sprite.Group()
    all_sprites = pygame.sprite.Group()
    all_sprites.add(sling_shot, stone)
    birds = lvl_selector(lvl)
    for bird in birds:
        all_sprites.add(bird)
    start_button = pygame.Rect(325, 300, 150, 70)
    quit_button = pygame.Rect(325, 380, 150, 70)
    start = True
    splash_time = 60
    main_menu = False
    running = True
    while running:
        await asyncio.sleep(0)
        if main_menu:
            for event in pygame.event.get():
                if event.type == pygame.QUIT:
                    running = False
                if event.type == pygame.MOUSEBUTTONDOWN:
                    if start_button.collidepoint(event.pos):
                        select_sound.play()
                        main_menu = False
                    if quit_button.collidepoint(event.pos):
                        select_sound.play()
                        running = False
            if y == 150:
                d = -1
            elif y == 140:
                d = 1
            y += vel * d
            window.fill(bg_color)
            pygame.draw.rect(window, (255, 50, 50), start_button)
            pygame.draw.rect(window, (255, 50, 50), quit_button)
            window.blit(title_image, (400 - title_image.get_width() // 2, y))
            render_text('start', (255, 255, 255), 400, 293, window, 50)
            render_text('quit', (255, 255, 255), 400, 373, window, 50)
        elif start:
            for event in pygame.event.get():
                if event.type == pygame.QUIT:
                    running = False
            window.blit(splash_screen, (0, 0))
            splash_time -= 1
            if splash_time <= 0:
                main_menu = True
                start = False
        else:
            for event in pygame.event.get():
                if event.type == pygame.QUIT:
                    running = False
                if event.type == pygame.MOUSEBUTTONDOWN:
                    stone.fired = True
                    throws += 1
                    throw_sound.play()
            x = pygame.mouse.get_pos()[0]
            if 120 <= x <= 670:
                sling_shot.rect.x = x - 25
            if not stone.fired:
                stone.rect.x = sling_shot.rect.x + 17.5
            if pygame.sprite.collide_rect(stone, sling_shot) and stone.vel < 0:
                stone.vel = -stone.vel
                stone.rect.y = sling_shot.rect.y - 15
                stone.fired = False
                if not stone.fired:
                    stone.rect.x = sling_shot.rect.x + 17.5
            for bird in birds.copy():
                if pygame.sprite.collide_rect(stone, bird):
                    bird.kill()
                    birds.remove(bird)
                    kill_sound.play()
                    kills += 1
                    if not birds:
                        stone.rect.y = sling_shot.rect.y - 12.5
                        stone.rect.x = sling_shot.rect.x
                        stone.fired = False
                        lvl += 1
                        current_group.empty()
                        box_group.empty()
                        birds.clear()
                        bird.kill()
                        birds = lvl_selector(lvl)
                        box_group = box_selector(lvl, box_group)
                        current_group = current_selector(lvl, current_group)
            for bird in birds:

<script>
  // pygbag creates the canvas without a tabindex, so it can never take focus and
  // keyboard events land on the body instead of the game. Make it focusable and
  // focus it on any interaction, which is also what unlocks browser audio.
  (function () {
    function wire() {
      var canvas = document.getElementById("canvas");
      if (!canvas) return false;
      if (!canvas.hasAttribute("tabindex")) canvas.setAttribute("tabindex", "0");
      if (canvas.dataset.arcadeFocus) return true;
      canvas.dataset.arcadeFocus = "1";
      ["pointerdown", "click", "keydown"].forEach(function (type) {
        canvas.addEventListener(type, function () { canvas.focus(); });
      });
      return true;
    }
    if (!wire()) {
      var tries = 0;
      var timer = setInterval(function () {
        if (wire() || ++tries > 200) clearInterval(timer);
      }, 100);
    }
  })();
</script>
