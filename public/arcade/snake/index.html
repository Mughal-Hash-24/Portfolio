# Helper modules are shipped base64-encoded. Writing them as Python string

def prepare_filesystem():
    workdir = pathlib.Path(tempfile.mkdtemp(prefix="arcade-"))
    os.chdir(workdir)

    for name, payload in ASSETS.items():
        target = pathlib.Path(name)
        target.parent.mkdir(parents=True, exist_ok=True)
        target.write_bytes(base64.b64decode(payload))

    for name, source in MODULES.items():
        target = pathlib.Path(name)
        target.parent.mkdir(parents=True, exist_ok=True)
        target.write_bytes(base64.b64decode(source))

    # Helper packages live beside the entry point, so make them importable.
    if str(workdir) not in sys.path:
        sys.path.insert(0, str(workdir))

import asyncio
import pygame, random

def Foods():
    food_x = random.randint(100, 700)
    food_y = random.randint(100, 500)
    food = pygame.Rect(food_x, food_y, 25, 25)
    foods.append(food)

def score_screen(text, color, x, y):
    screen_text = font.render(text, True, color)
    window.blit(screen_text, [x, y])

def draw_snake(window, color, snk_list, size):
    for x, y in snk_list:
        pygame.draw.rect(window, (0, 155, 0), [x, y, size, size])

def restart_game():
    global snake_x, snake_y, moving_left, moving_right, moving_up, moving_down, snk_list, snk_length, score, game_over, foods
    snake_x = 150
    snake_y = 150
    snk_length = 1
    score = 0
    moving_left = False
    moving_right = True
    moving_up = False
    moving_down = False
    snk_list = []
    foods = []
    Foods()
    game_over = False

async def main():
    global bg, bg_color, clock, event, font, foods, game_over, head, moving_down, moving_left, moving_right, moving_up, running, score, size, snack, snak_vel, snake, snake_x, snake_y, snk_length, snk_list, win_res, window
    pygame.init()
    clock = pygame.time.Clock()
    win_res = (800, 600)
    window = pygame.display.set_mode(win_res)
    snake_x = 150
    snake_y = 150
    size = 25
    snak_vel = 3
    score = 0
    moving_left = False
    moving_right = True
    moving_up = False
    moving_down = False
    bg_color = (150, 220, 255)
    foods = []
    font = pygame.font.SysFont('Arial', 45)
    Foods()
    snk_list = []
    snk_length = 1
    restart_game()
    running = True
    while running:
        await asyncio.sleep(0)
        if game_over:
            window.fill(bg_color)
            score_screen('Game Over! Press Enter to restart', (0, 0, 0), 120, win_res[1] / 2 - 30)
            for event in pygame.event.get():
                if event.type == pygame.QUIT:
                    running = False
                if event.type == pygame.KEYDOWN:
                    if event.key == pygame.K_RETURN:
                        restart_game()
        else:
            for event in pygame.event.get():
                if event.type == pygame.QUIT:
                    running = False
                if event.type == pygame.KEYDOWN:
                    if event.key == pygame.K_UP and (not moving_down):
                        moving_up = True
                        moving_down = False
                        moving_left = False
                        moving_right = False
                    if event.key == pygame.K_DOWN and (not moving_up):
                        moving_up = False
                        moving_down = True
                        moving_left = False
                        moving_right = False
                    if event.key == pygame.K_RIGHT and (not moving_left):
                        moving_up = False
                        moving_down = False
                        moving_left = False
                        moving_right = True
                    if event.key == pygame.K_LEFT and (not moving_right):
                        moving_up = False
                        moving_down = False
                        moving_left = True
                        moving_right = False
            bg = pygame.draw.rect(window, bg_color, [0, 0, 800, 600])
            snake = pygame.draw.rect(window, (0, 155, 0), [snake_x, snake_y, size, size])
            if moving_down:
                snake_y += snak_vel
            elif moving_left:
                snake_x -= snak_vel
            elif moving_right:
                snake_x += snak_vel
            elif moving_up:
                snake_y -= snak_vel
            for snack in foods.copy():
                if snake.colliderect(snack):
                    foods.remove(snack)
                    Foods()
                    score += 10
                    snk_length += 10
            score_screen('Score: ' + str(score), (0, 0, 0), 5, 5)
            for snack in foods:
                pygame.draw.rect(window, (255, 0, 0), snack)
            head = []
            head.append(snake_x)
            head.append(snake_y)
            snk_list.append(head)
            if len(snk_list) > snk_length:
                del snk_list[0]
            draw_snake(window, (0, 155, 0), snk_list, size)
            if snake_x < 0 or snake_x > win_res[0]:
                game_over = True
            if snake_y < 0 or snake_y > win_res[1]:
                game_over = True
            if head in snk_list[:-1]:
                game_over = True
        pygame.display.update()
        clock.tick(60)
    pygame.quit()

try:
    asyncio.run(main())
except SystemExit:
    pass
except BaseException:
    # A portable game can still fail on a platform detail (a missing

            'background:black;color:#ff8080;font:11px monospace;'
            'white-space:pre-wrap;overflow:auto'
        )
        box.textContent = info
        document.body.appendChild(box)
    except BaseException:
        pass

<script>
  // pygbag creates the canvas without a tabindex, so it can never take focus and
  // keyboard events land on the body instead of the game. Make it focusable and
  // focus it on any interaction, which is also what unlocks browser audio.
  (function () {
    function wire() {
      var canvas = document.getElementById("canvas");
      if (!canvas) return false;
      if (!canvas.hasAttribute("tabindex")) canvas.setAttribute("tabindex", "0");
      if (canvas.dataset.arcadeFocus) return true;
      canvas.dataset.arcadeFocus = "1";
      ["pointerdown", "click", "keydown"].forEach(function (type) {
        canvas.addEventListener(type, function () { canvas.focus(); });
      });
      return true;
    }
    if (!wire()) {
      var tries = 0;
      var timer = setInterval(function () {
        if (wire() || ++tries > 200) clearInterval(timer);
      }, 100);
    }
  })();
</script>
