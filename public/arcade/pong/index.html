# Helper modules are shipped base64-encoded. Writing them as Python string
# literals breaks on modules that contain quotes, triple quotes, or backslash

def prepare_filesystem():
    workdir = pathlib.Path(tempfile.mkdtemp(prefix="arcade-"))
    os.chdir(workdir)

    for name, payload in ASSETS.items():
        target = pathlib.Path(name)
        target.parent.mkdir(parents=True, exist_ok=True)
        target.write_bytes(base64.b64decode(payload))

    for name, source in MODULES.items():
        target = pathlib.Path(name)
        target.parent.mkdir(parents=True, exist_ok=True)
        target.write_bytes(base64.b64decode(source))

    # Helper packages live beside the entry point, so make them importable.
    if str(workdir) not in sys.path:
        sys.path.insert(0, str(workdir))


prepare_filesystem()

import asyncio
import pygame
import math

class Ball(pygame.sprite.Sprite):

    def __init__(self, x, y, vel, angle, radius, color):
        super().__init__()
        self.image = pygame.Surface((radius * 2, radius * 2), pygame.SRCALPHA)
        pygame.draw.circle(self.image, color, (radius, radius), radius)
        self.rect = self.image.get_rect()
        self.rect.center = (x, y)
        self.vel = vel
        self.angle = angle
        self.radius = radius

    def update(self):
        self.rect.x += self.vel * math.cos(self.angle)
        self.rect.y += self.vel * math.sin(self.angle)
        if self.rect.colliderect(pad1.rect):
            self.angle = math.pi - self.angle
        if self.rect.colliderect(pad2.rect):
            self.angle = math.pi - self.angle

    def reflect_horizontal(self):
        self.angle = math.pi - self.angle

    def reflect_vertical(self):
        self.angle = -self.angle

class Pad1(pygame.sprite.Sprite):

    def __init__(self):
        super().__init__()
        self.image = pygame.Surface((20, 120))
        self.image.fill((0, 0, 255))
        self.rect = self.image.get_rect()
        self.rect.midleft = (5, height // 2)
        self.vel = 8

    def move_up(self):
        self.rect.y -= self.vel

    def move_down(self):
        self.rect.y += self.vel

class Pad2(pygame.sprite.Sprite):

    def __init__(self):
        super().__init__()
        self.image = pygame.Surface((20, 120))
        self.image.fill((0, 0, 255))
        self.rect = self.image.get_rect()
        self.rect.x = width - 25
        self.rect.y = height // 2 - 60
        self.vel = 8

    def move_up(self):
        self.rect.y -= self.vel

    def move_down(self):
        self.rect.y += self.vel

async def main():
    global all_sprites, ball, event, height, keys, pad1, pad2, running, screen, width
    pygame.init()
    width, height = (900, 600)
    all_sprites = pygame.sprite.Group()
    ball = Ball(400, 300, 6, math.pi / 6, 10, (255, 0, 0))
    pad1 = Pad1()
    pad2 = Pad2()
    all_sprites.add(ball, pad1, pad2)
    screen = pygame.display.set_mode((width, height))
    pygame.display.set_caption('Ball Reflection')
    running = True
    while running:
        await asyncio.sleep(0)
        pygame.time.delay(12)
        for event in pygame.event.get():
            if event.type == pygame.QUIT:
                running = False
        keys = pygame.key.get_pressed()
        if keys[pygame.K_UP] and pad2.rect.y > 0:
            pad2.rect.y -= 5
        if keys[pygame.K_DOWN] and pad2.rect.y < height - 120:
            pad2.rect.y += 5
        if keys[pygame.K_w] and pad1.rect.y > 0:
            pad1.rect.y -= 5
        if keys[pygame.K_s] and pad1.rect.y < height - 120:
            pad1.rect.y += 5
        if ball.rect.center[0] <= 10 or ball.rect.center[0] >= width - 10:
            ball.rect.center = (width // 2, height // 2)
            ball.angle = math.pi / 6
        if ball.rect.center[1] <= 10 or ball.rect.center[1] >= height - 10:
            ball.angle = -ball.angle
        screen.fill((255, 255, 255))
        all_sprites.draw(screen)
        all_sprites.update()
        pygame.display.flip()
    pygame.quit()

try:
    asyncio.run(main())
except SystemExit:
    pass
except BaseException:
    # A portable game can still fail on a platform detail (a missing
    # codec, a font). Surface it in the page instead of a black screen.
    import traceback
    info = traceback.format_exc()
    traceback.print_exc()
    try:
        from js import document
        box = document.createElement('pre')
        box.style.cssText = (

            'background:black;color:#ff8080;font:11px monospace;'
            'white-space:pre-wrap;overflow:auto'
        )
        box.textContent = info
        document.body.appendChild(box)
    except BaseException:
        pass

<script>
  // pygbag creates the canvas without a tabindex, so it can never take focus and
  // keyboard events land on the body instead of the game. Make it focusable and
  // focus it on any interaction, which is also what unlocks browser audio.
  (function () {
    function wire() {
      var canvas = document.getElementById("canvas");
      if (!canvas) return false;
      if (!canvas.hasAttribute("tabindex")) canvas.setAttribute("tabindex", "0");
      if (canvas.dataset.arcadeFocus) return true;
      canvas.dataset.arcadeFocus = "1";
      ["pointerdown", "click", "keydown"].forEach(function (type) {
        canvas.addEventListener(type, function () { canvas.focus(); });
      });
      return true;
    }
    if (!wire()) {
      var tries = 0;
      var timer = setInterval(function () {
        if (wire() || ++tries > 200) clearInterval(timer);
      }, 100);
    }
  })();
</script>
