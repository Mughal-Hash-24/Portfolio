def prepare_filesystem():
    workdir = pathlib.Path(tempfile.mkdtemp(prefix="arcade-"))
    os.chdir(workdir)

    for name, payload in ASSETS.items():
        target = pathlib.Path(name)
        target.parent.mkdir(parents=True, exist_ok=True)
        target.write_bytes(base64.b64decode(payload))

    for name, source in MODULES.items():
        target = pathlib.Path(name)
        target.parent.mkdir(parents=True, exist_ok=True)
        target.write_bytes(base64.b64decode(source))

    # Helper packages live beside the entry point, so make them importable.
    if str(workdir) not in sys.path:
        sys.path.insert(0, str(workdir))

import asyncio
import pygame
import math
import random

def score_screen(text, color, x, y):
    screen_text = font.render(text, True, color)
    window.blit(screen_text, [x, y])

class Bird(pygame.sprite.Sprite):

    def __init__(self):
        super().__init__()
        self.image = pygame.Surface((50, 50), pygame.SRCALPHA)
        self.rect = self.image.get_rect()
        self.rect.center = (200, win_res[1] / 2)
        self.vel = 0
        self.acc = 0.2
        self.draw()

    def draw(self):
        pygame.draw.circle(self.image, (255, 0, 0), (25, 25), 25)
        self.rect = self.image.get_rect(center=self.rect.center)

    def update(self):
        if self.rect.y >= 0 and self.rect.y <= win_res[1] - 55:
            self.vel += self.acc
            self.rect.y += self.vel

    def jump(self):
        self.vel = -6

class Obstacles:

    def __init__(self, x, y, width, height, gap):
        self.x = x
        self.y = y
        self.width = width
        self.height = height
        self.gap = gap
        self.vel = 3

    def draw(self, win):
        pygame.draw.rect(win, (0, 0, 255), (self.x, self.y, self.width, self.height))
        pygame.draw.rect(win, (0, 0, 255), (self.x, self.y + self.height + self.gap, self.width, self.height))

    def update(self):
        self.x -= self.vel

async def game_loop():
    score = 0
    bird = Bird()
    obstacles = []
    obstacle_spawn_timer = pygame.time.get_ticks()
    obstacle_spawn_interval = 3000
    obstacle = Obstacles(790, 0, 100, random.randint(200, 400), 200)
    obstacles.append(obstacle)
    all_sprites = pygame.sprite.Group()
    all_sprites.add(bird)
    game_over = False
    running = True
    while running:
        await asyncio.sleep(0)
        if game_over:
            for event in pygame.event.get():
                if event.type == pygame.QUIT:
                    running = False
                if event.type == pygame.KEYDOWN:
                    if event.key == pygame.K_RETURN:
                        game_loop()
            score_screen('Game Over! Press Enter to restart', (0, 0, 0), 120, win_res[1] / 2 - 30)
        else:
            for event in pygame.event.get():
                if event.type == pygame.QUIT:
                    running = False
                if event.type == pygame.KEYDOWN:
                    if event.key == pygame.K_UP:
                        bird.jump()
            if bird.rect.y <= 0 or bird.rect.y >= win_res[1] - 50:
                game_over = True
            current_time = pygame.time.get_ticks()
            if current_time - obstacle_spawn_timer >= obstacle_spawn_interval:
                obstacle_spawn_timer = current_time
                new_obstacle = Obstacles(790, 0, 100, random.randint(200, 380), 200)
                obstacles.append(new_obstacle)
                score += 1
            window.fill(bg_color)
            for obs in obstacles:
                top_obs_rect = pygame.Rect(obs.x, obs.y, obs.width, obs.height)
                bottom_obs_rect = pygame.Rect(obs.x, obs.y + obs.height + obs.gap, obs.width, obs.height)
                if bird.rect.colliderect(top_obs_rect) or bird.rect.colliderect(bottom_obs_rect):
                    game_over = True
            for obs in obstacles.copy():
                if obs.x + obs.width < 0:
                    obstacles.remove(obs)
            for obs in obstacles:
                obs.draw(window)
                obs.update()
            all_sprites.draw(window)
            score_screen('Score: ' + str(score), (0, 0, 0), 10, 10)
            all_sprites.update()
        pygame.display.update()
        clock.tick(60)
    pygame.quit()

async def main():
    global bg_color, clock, font, win_res, window
    pygame.init()
    clock = pygame.time.Clock()
    win_res = (800, 600)
    window = pygame.display.set_mode(win_res)
    bg_color = (150, 220, 255)
    font = pygame.font.SysFont('Arial', 45)
    await game_loop()

try:
    asyncio.run(main())
except SystemExit:
    pass
except BaseException:
    # A portable game can still fail on a platform detail (a missing
    # codec, a font). Surface it in the page instead of a black screen.
    import traceback
    info = traceback.format_exc()
    traceback.print_exc()
    try:
        from js import document
        box = document.createElement('pre')
        box.style.cssText = (
            'position:fixed;inset:0;margin:0;padding:16px;z-index:99;'
            'background:black;color:#ff8080;font:11px monospace;'
            'white-space:pre-wrap;overflow:auto'
        )
        box.textContent = info
        document.body.appendChild(box)
    except BaseException:
        pass

<script>
  // pygbag creates the canvas without a tabindex, so it can never take focus and
  // keyboard events land on the body instead of the game. Make it focusable and
  // focus it on any interaction, which is also what unlocks browser audio.
  (function () {
    function wire() {
      var canvas = document.getElementById("canvas");
      if (!canvas) return false;
      if (!canvas.hasAttribute("tabindex")) canvas.setAttribute("tabindex", "0");
      if (canvas.dataset.arcadeFocus) return true;
      canvas.dataset.arcadeFocus = "1";
      ["pointerdown", "click", "keydown"].forEach(function (type) {
        canvas.addEventListener(type, function () { canvas.focus(); });
      });
      return true;
    }
    if (!wire()) {
      var tries = 0;
      var timer = setInterval(function () {
        if (wire() || ++tries > 200) clearInterval(timer);
      }, 100);
    }
  })();
</script>
