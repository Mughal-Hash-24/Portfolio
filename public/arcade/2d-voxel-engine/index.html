# Helper modules are shipped base64-encoded. Writing them as Python string
# literals breaks on modules that contain quotes, triple quotes, or backslash
# escapes, which is exactly what a real dependency looks like.
MODULES = {}


def prepare_filesystem():
    workdir = pathlib.Path(tempfile.mkdtemp(prefix="arcade-"))
    os.chdir(workdir)

    for name, payload in ASSETS.items():
        target = pathlib.Path(name)
        target.parent.mkdir(parents=True, exist_ok=True)
        target.write_bytes(base64.b64decode(payload))

    for name, source in MODULES.items():
        target = pathlib.Path(name)
        target.parent.mkdir(parents=True, exist_ok=True)
        target.write_bytes(base64.b64decode(source))

    # Helper packages live beside the entry point, so make them importable.
    if str(workdir) not in sys.path:
        sys.path.insert(0, str(workdir))


prepare_filesystem()

import asyncio
import pygame

def generate_voxels():
    vox = []
    rows = 20
    cols = 25
    for y in range(rows):
        for x in range(cols):
            rect = pygame.Rect([x * 40, y * 40, 40, 40])
            vox.append(rect)
    return vox

def generate_voxel_state():
    v_s = []
    for y in range(20):
        for x in range(25):
            if y == 16:
                v_s.append(1)
            elif y > 16:
                v_s.append(2)
            else:
                v_s.append(0)
    return v_s

def menu_buttons():
    r = []
    rows = 10
    cols = 10
    for i in range(rows):
        for j in range(cols):
            if len(r) >= len(button_images):
                return r
            r.append(pygame.Rect([j * 50, i * 50, 40, 40]))
    return r

async def game_loop():
    facings = ['right' for _ in range(500)]
    voxels = generate_voxels()
    voxel_states = generate_voxel_state()
    placing_state = 3
    buttons = menu_buttons()
    menu = False
    running = True
    while running:
        await asyncio.sleep(0)
        if menu:
            for event in pygame.event.get():
                if event.type == pygame.QUIT:
                    running = False
                if event.type == pygame.KEYDOWN:
                    if event.key == pygame.K_ESCAPE or pygame.K_m:
                        menu = False
                if event.type == pygame.MOUSEBUTTONDOWN and event.button == 1:
                    m_x, m_y = pygame.mouse.get_pos()
                    m_r = pygame.Rect([m_x, m_y, 1, 1])
                    for i, button in enumerate(buttons):
                        if m_r.colliderect(button):
                            placing_state = i + 1
                            menu = False
            window.fill(bg_color)
            for i, button in enumerate(buttons):
                window.blit(button_images[i], (button.x, button.y))
        else:
            for event in pygame.event.get():
                if event.type == pygame.QUIT:
                    running = False
                if event.type == pygame.MOUSEBUTTONDOWN:
                    m_x, m_y = pygame.mouse.get_pos()
                    m_r = pygame.Rect([m_x, m_y, 1, 1])
                    for i, voxel in enumerate(voxels):
                        if m_r.colliderect(voxel):
                            if event.button == 1:
                                voxel_states[i] = 0
                            elif event.button == 3 and (voxel_states[i] == 0 or voxel_states[i] in rotatable):
                                voxel_states[i] = placing_state
                                if voxel_states[i] in rotatable:
                                    if facings[i] == 'left':
                                        facings[i] = 'right'
                                    elif facings[i] == 'right':
                                        facings[i] = 'left'
                if event.type == pygame.KEYDOWN:
                    if event.key == pygame.K_m or event.key == pygame.K_ESCAPE:
                        menu = True
            window.fill(bg_color)
            for i, voxel in enumerate(voxels):
                state = voxel_states[i]
                if state in voxel_images:
                    window.blit(voxel_images[state], (voxel.x, voxel.y))
                elif state in rotated_images:
                    if facings[i] == 'left':
                        window.blit(rotated_images[state][0], (voxel.x, voxel.y))
                    elif facings[i] == 'down':
                        window.blit(rotated_images[state][90], (voxel.x, voxel.y))
                    elif facings[i] == 'right':
                        window.blit(rotated_images[state][180], (voxel.x, voxel.y))
                    elif facings[i] == 'up':
                        window.blit(rotated_images[state][270], (voxel.x, voxel.y))
        pygame.display.update()
        clock.tick(60)
    pygame.quit()

<script>
  // pygbag creates the canvas without a tabindex, so it can never take focus and
  // keyboard events land on the body instead of the game. Make it focusable and
  // focus it on any interaction, which is also what unlocks browser audio.
  (function () {
    function wire() {
      var canvas = document.getElementById("canvas");
      if (!canvas) return false;
      if (!canvas.hasAttribute("tabindex")) canvas.setAttribute("tabindex", "0");
      if (canvas.dataset.arcadeFocus) return true;
      canvas.dataset.arcadeFocus = "1";
      ["pointerdown", "click", "keydown"].forEach(function (type) {
        canvas.addEventListener(type, function () { canvas.focus(); });
      });
      return true;
    }
    if (!wire()) {
      var tries = 0;
      var timer = setInterval(function () {
        if (wire() || ++tries > 200) clearInterval(timer);
      }, 100);
    }
  })();
</script>
