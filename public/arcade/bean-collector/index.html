# Helper modules are shipped base64-encoded. Writing them as Python string
# literals breaks on modules that contain quotes, triple quotes, or backslash
# escapes, which is exactly what a real dependency looks like.
MODULES = {}


def prepare_filesystem():
    workdir = pathlib.Path(tempfile.mkdtemp(prefix="arcade-"))
    os.chdir(workdir)

    for name, payload in ASSETS.items():
        target = pathlib.Path(name)
        target.parent.mkdir(parents=True, exist_ok=True)
        target.write_bytes(base64.b64decode(payload))

    for name, source in MODULES.items():
        target = pathlib.Path(name)
        target.parent.mkdir(parents=True, exist_ok=True)
        target.write_bytes(base64.b64decode(source))

    # Helper packages live beside the entry point, so make them importable.
    if str(workdir) not in sys.path:
        sys.path.insert(0, str(workdir))


prepare_filesystem()

import asyncio
import pygame
import random

class Object(pygame.sprite.Sprite):

    def __init__(self):
        super().__init__()
        self.image = pygame.image.load('bean.png').convert()
        self.image.set_colorkey((0, 0, 0))
        self.rect = self.image.get_rect()
        self.rect.x = random.randint(0, width - self.rect.width)
        self.rect.y = random.randint(-height, -self.rect.height)

    def update(self):
        self.rect.y += b_vel

class Mug(pygame.sprite.Sprite):

    def __init__(self):
        super().__init__()
        self.image = pygame.image.load('mug.png').convert()
        self.image.set_colorkey((0, 0, 0))
        self.rect = self.image.get_rect()
        self.rect.x = w_rect
        self.rect.y = h_rect

    def update(self):
        keys = pygame.key.get_pressed()
        if keys[pygame.K_LEFT] and self.rect.left > 0:
            self.rect.x -= vel
        if keys[pygame.K_RIGHT] and self.rect.right < width:
            self.rect.x += vel
        if keys[pygame.K_UP] and self.rect.top > 0:
            self.rect.y -= vel
        if keys[pygame.K_DOWN] and self.rect.bottom < height:
            self.rect.y += vel

async def main():
    global all_objects, b_vel, bean, bg, clock, collision, collision_sound, color_dark, color_light, count, event, h_but, h_rect, height, image, keys, mouse, mug, new_object, running, score, score_sound, score_text, screen, screen_color, small_font, text, timer_color, timer_height, timer_posx, timer_posy, timer_vel, timer_width, vel, w_but, w_rect, width, x, y
    all_objects = pygame.sprite.Group()
    pygame.init()
    pygame.mixer.init()
    screen = pygame.display.set_mode((500, 500))
    pygame.display.set_caption('Bean Collector By Mughal')
    image = pygame.image.load('bean.png')
    bg = pygame.image.load('background.png')
    bean = pygame.image.load('bean.png')
    pygame.display.set_icon(image)
    screen_color = (155, 0, 255)
    color_dark = (100, 100, 100)
    color_light = (170, 170, 170)
    timer_color = (150, 75, 0)
    timer_width = 150
    timer_height = 30
    timer_vel = 0.5
    timer_posx = 5
    timer_posy = 465
    collision_sound = pygame.mixer.Sound('collision_sound.wav')
    score_sound = pygame.mixer.Sound('score_sound.wav')
    score = 0
    x = 50
    y = 50
    clock = pygame.time.Clock()
    count = 1
    w_rect = 225
    h_rect = 300
    w_but = 360
    h_but = 460
    vel = 5
    b_vel = 5
    small_font = pygame.font.SysFont('Arial', 30)
    text = small_font.render('quit', True, (255, 255, 255))
    width = screen.get_width()
    height = screen.get_height()
    running = True
    mug = Mug()
    while running:
        await asyncio.sleep(0)
        pygame.time.delay(10)
        for event in pygame.event.get():
            if event.type == pygame.QUIT:
                running = False
            if event.type == pygame.MOUSEBUTTONDOWN:
                if w_but <= mouse[0] <= w_but + 140 and h_but <= mouse[1] <= h_but + 40:
                    running = False
        if score == 100:
            vel = 4
            b_vel = 6
        elif score == 200:
            vel = 3
            b_vel = 7
        keys = pygame.key.get_pressed()
        if keys[pygame.K_LEFT] and mug.rect.left > 0:
            mug.rect.x -= vel
        if keys[pygame.K_RIGHT] and mug.rect.right < width:
            mug.rect.x += vel
        timer_width -= timer_vel
        if timer_width <= 0:
            running = False
        all_objects.update()
        screen.blit(bg, dest=(0, 0))
        if random.randint(0, 100) < 5:
            new_object = Object()
            all_objects.add(new_object)
        collision = pygame.sprite.spritecollide(mug, all_objects, True)
        if collision:
            score += 1
            print('Collision detected! Score:', score)
            timer_width = 150
            collision_sound.play()
            if score % 50 == 0:
                score_sound.play()
        score_text = small_font.render('Score: ' + str(score), True, (150, 75, 0))
        screen.blit(score_text, (10, 10))
        all_objects.draw(screen)
        screen.blit(mug.image, mug.rect)
        pygame.draw.rect(screen, timer_color, (timer_posx, timer_posy, timer_width, timer_height))
        mouse = pygame.mouse.get_pos()
        if w_but <= mouse[0] <= w_but + 140 and h_but <= mouse[1] <= h_but + 40:
            pygame.draw.rect(screen, color_light, pygame.Rect(w_but, h_but, 140, 40))
        else:
            pygame.draw.rect(screen, color_dark, pygame.Rect(w_but, h_but, 140, 40))
        screen.blit(text, dest=(w_but + 40, h_but))
        clock.tick(60)
        pygame.display.update()
    pygame.quit()

try:
    asyncio.run(main())
except SystemExit:
    pass
except BaseException:
    # A portable game can still fail on a platform detail (a missing
    # codec, a font). Surface it in the page instead of a black screen.
    import traceback
    info = traceback.format_exc()
    traceback.print_exc()
    try:
        from js import document
        box = document.createElement('pre')
        box.style.cssText = (
            'position:fixed;inset:0;margin:0;padding:16px;z-index:99;'
            'background:black;color:#ff8080;font:11px monospace;'
            'white-space:pre-wrap;overflow:auto'
        )
        box.textContent = info
        document.body.appendChild(box)
    except BaseException:
        pass

<script>
  // pygbag creates the canvas without a tabindex, so it can never take focus and
  // keyboard events land on the body instead of the game. Make it focusable and
  // focus it on any interaction, which is also what unlocks browser audio.
  (function () {
    function wire() {
      var canvas = document.getElementById("canvas");
      if (!canvas) return false;
      if (!canvas.hasAttribute("tabindex")) canvas.setAttribute("tabindex", "0");
      if (canvas.dataset.arcadeFocus) return true;
      canvas.dataset.arcadeFocus = "1";
      ["pointerdown", "click", "keydown"].forEach(function (type) {
        canvas.addEventListener(type, function () { canvas.focus(); });
      });
      return true;
    }
    if (!wire()) {
      var tries = 0;
      var timer = setInterval(function () {
        if (wire() || ++tries > 200) clearInterval(timer);
      }, 100);
    }
  })();
</script>
